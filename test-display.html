<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Display Fix</title>
</head>
<body>
    <h1>Test Province Code Conversion</h1>
    <div id="result"></div>
    
    <script src="assets/js/vietnam-admin-divisions.js"></script>
    <script>
        // Test helper function
        function getProvinceName(code) {
            if(!code || !vietnamAdminDivisions) return "-";
            const prov = vietnamAdminDivisions.provinces?.find(p => p.code === code);
            return prov?.name || code || "-";
        }
        
        // Test data from API
        const userData = {
            quequan: "52",
            diachi: "Tổ 7,Khu Phố 3"
        };
        
        const result = document.getElementById("result");
        result.innerHTML = `
            <p><strong>Input Province Code:</strong> ${userData.quequan}</p>
            <p><strong>Converted Province Name:</strong> ${getProvinceName(userData.quequan)}</p>
            <p><strong>Địa chỉ:</strong> ${userData.diachi}</p>
            <hr>
            <p><strong>Test Result:</strong> ${userData.quequan === "52" && getProvinceName(userData.quequan) === "Tỉnh Bình Định" ? "✅ SUCCESS" : "❌ FAILED"}</p>
        `;
    </script>
</body>
</html>
