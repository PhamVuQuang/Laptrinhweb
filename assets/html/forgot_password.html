<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <title>Quên Mật Khẩu</title>
        <style>
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(270deg,#4facfe,#00f2fe,#43e97b);
            background-size:600% 600%;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }
        .forgot{
            width:420px;
            padding:35px;
            background:rgba(255,255,255,0.95);
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.25);
        }
        .forgot h3{
            text-align:center;
            font-size:28px;
            margin-bottom:20px;
            color:#2c3e50;
        }
        .label{
            display:block;
            margin-top:10px;
            font-weight:bold;
        }
        .input{
            width:100%;
            height:36px;
            margin-top:6px;
            padding:0 10px;
            border-radius:8px;
            border:1px solid #ccc;
            outline:none;
            transition:0.3s;
            box-sizing:border-box;
        }
        .input:focus{
            border-color:#4facfe;
            box-shadow:0 0 6px rgba(79,172,254,0.5);
        }
        .btn{
            width:100%;
            height:40px;
            margin-top:14px;
            border:none;
            border-radius:20px;
            background:linear-gradient(135deg,#4facfe,#00c6ff);
            color:white;
            font-size:15px;
            cursor:pointer;
            transition:0.3s;
        }
        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 5px 12px rgba(0,0,0,0.2);
        }
        .back-link{
            display:block;
            text-align:center;
            margin-top:12px;
            text-decoration:none;
            color:#007bff;
            font-weight:bold;
        }
        .back-link:hover{
            text-decoration:underline;
        }
        </style>
    </head>
    <body>
        <div class="forgot">
            <h3>Quên Mật Khẩu</h3>
            <label class="label">Tên đăng nhập</label>
            <input id="fp_username" class="input" type="text" placeholder="Nhập tên đăng nhập">

            <label class="label">Số báo danh</label>
            <input id="fp_sbd" class="input" type="text" placeholder="Nhập số báo danh">

            <label class="label">CCCD / CMND</label>
            <input id="fp_cccd" class="input" type="text" placeholder="Nhập CCCD/CMND">

            <label class="label">Mật khẩu mới</label>
            <input id="fp_new_password" class="input" type="password" placeholder="Nhập mật khẩu mới">

            <label class="label">Xác nhận mật khẩu mới</label>
            <input id="fp_confirm_password" class="input" type="password" placeholder="Nhập lại mật khẩu mới">

            <button class="btn" type="button" onclick="quenMatKhau()">Đổi mật khẩu</button>
            <a class="back-link" href="/assets/html/login.html">← Quay lại đăng nhập</a>
        </div>

        <script src="../../main.js"></script>
        <script>
            blockLoginPage();
        </script>
    </body>
</html>
